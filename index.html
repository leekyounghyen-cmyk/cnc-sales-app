<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>씨앤씨</title>
<meta name="description" content="씨앤씨 견적·매출, 유상수리 진행, 광고 현황을 한 곳에서">
<meta property="og:type" content="website">
<meta property="og:title" content="씨앤씨 업무 앱">
<meta property="og:description" content="눌러서 열고 홈 화면에 추가하면 앱처럼 쓸 수 있어요">
<meta property="og:image" content="https://leekyounghyen-cmyk.github.io/cnc-sales-app/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://leekyounghyen-cmyk.github.io/cnc-sales-app/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="씨앤씨">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#f2f4f7; --fg:#191f28; --mut:#8b95a1; --card:#fff; --pri:#3182f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1013; --fg:#eef0f3; --mut:#7e8792; --card:#1b1e23; --pri:#4c95ff; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; overflow:hidden; }
  #app { position:fixed; left:0; right:0; bottom:0; top:env(safe-area-inset-top); width:100%; height:calc(100% - env(safe-area-inset-top)); border:0; background:var(--bg); }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; z-index:5; transition:opacity .35s;
    background:radial-gradient(120% 80% at 50% 38%, #ffffff 0%, #f3f8fd 60%, #e9f3fb 100%); }
  @media (prefers-color-scheme: dark) { #splash { background:radial-gradient(120% 80% at 50% 38%, #1d2633 0%, #121820 70%, #0e1013 100%); } }
  #splash .mk { width:132px; height:auto; animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both; filter:drop-shadow(0 10px 22px rgb(0 110 190/.18)); }
  #splash b { font-size:34px; font-weight:900; letter-spacing:2px; margin-top:22px; color:#3c4046; animation:up .5s .15s both; }
  @media (prefers-color-scheme: dark) { #splash b { color:#eef0f3; } }
  #splash span { font-size:14px; color:var(--mut); margin-top:6px; letter-spacing:.5px; animation:up .5s .25s both; }
  #splash .bar { width:120px; height:4px; border-radius:4px; margin-top:28px; background:rgb(127 127 127/.15); overflow:hidden; animation:up .5s .35s both; }
  #splash .bar i { display:block; width:45%; height:100%; border-radius:4px; background:linear-gradient(90deg,#9ec43e,#0099df); animation:load 1.1s ease-in-out infinite; }
  #splash .ft { position:absolute; bottom:calc(28px + env(safe-area-inset-bottom)); font-size:12px; color:var(--mut); letter-spacing:1px; }
  #splash.off { opacity:0; pointer-events:none; }
  @keyframes pop { from { opacity:0; transform:scale(.7) } to { opacity:1; transform:none } }
  @keyframes up { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
  @keyframes load { 0% { transform:translateX(-110%) } 100% { transform:translateX(240%) } }
  #install { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:6; display:none; align-items:center; gap:10px;
    background:var(--card); color:var(--fg); border-radius:16px; padding:12px 12px 12px 14px; box-shadow:0 6px 24px rgb(0 0 0/.18); font-size:14px; line-height:1.4; }
  #install.on { display:flex; }
  #install img { width:40px; height:40px; border-radius:10px; flex:0 0 auto; }
  #install div { flex:1; min-width:0; }
  #install button { border:0; font:inherit; font-weight:700; border-radius:10px; padding:9px 12px; cursor:pointer; }
  #iBtn { background:var(--pri); color:#fff; }
  #iX { background:none; color:var(--mut); padding:9px 6px !important; }
  #offline { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--bg); z-index:7; text-align:center; padding:24px; }
  #offline.on { display:flex; }
  #offline button { border:0; background:var(--pri); color:#fff; font-size:16px; font-weight:700; border-radius:12px; padding:12px 20px; }
  #inapp, #guide { position:fixed; inset:0; z-index:8; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg); text-align:center; padding:28px; }
  #inapp.on, #guide.on { display:flex; }
  #inapp img, #guide img { width:76px; height:76px; border-radius:18px; }
  #inapp b, #guide b { font-size:20px; }
  #inapp p, #guide p { margin:0; font-size:15px; line-height:1.6; color:var(--fg); }
  #inapp small, #guide small { color:var(--mut); font-size:13px; line-height:1.5; }
  .big { border:0; background:var(--pri); color:#fff; font-size:17px; font-weight:700; border-radius:14px; padding:14px 22px; width:100%; max-width:320px; }
  .sub { border:0; background:none; color:var(--mut); font-size:14px; padding:8px; text-decoration:underline; }
  .steps { text-align:left; background:var(--card); border-radius:16px; padding:14px 16px; width:100%; max-width:340px; box-sizing:border-box; }
  .steps div { padding:6px 0; font-size:15px; }
  .arrow { position:fixed; bottom:calc(6px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); font-size:34px; animation:bob 1s infinite; }
  @keyframes bob { 50% { transform:translate(-50%,8px); } }
  #pushc { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:9; display:none; background:var(--card); color:var(--fg);
    border-radius:18px; padding:16px; box-shadow:0 10px 32px rgb(0 0 0/.22); font-size:15px; line-height:1.5; max-width:440px; margin:0 auto; }
  #pushc.on { display:block; animation:pcup .3s ease both; }
  @keyframes pcup { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
  #pushc .r { display:flex; gap:12px; align-items:center; }
  #pushc img { width:44px; height:44px; border-radius:12px; flex:0 0 auto; box-shadow:0 0 0 1px rgb(127 127 127/.2); }
  #pushc small { color:var(--mut); }
  #pushc .b { display:flex; gap:8px; margin-top:12px; }
  #pushc button { flex:1; border:0; font:inherit; font-weight:700; border-radius:12px; padding:11px; cursor:pointer; }
  #pcOn { background:linear-gradient(90deg,#7fb33a,#0099df); color:#fff; }
  #pcNo { background:rgb(127 127 127/.12); color:var(--fg); }
  #ptoast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10; background:rgb(25 31 40/.92); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; display:none; max-width:86%; text-align:center; }
  #ptoast.on { display:block; }
</style>
</head>
<body>
<div id="splash"><img class="mk" src="icons/mark.png" alt=""><b>씨앤씨</b><span>불러오는 중…</span><div class="bar"><i></i></div><div class="ft">C&amp;C CO., LTD.</div></div>
<iframe id="app" title="씨앤씨" allow="clipboard-write"></iframe>
<div id="install"><img src="icons/icon-192.png" alt=""><div id="iText"><b>씨앤씨 앱 설치</b><br><span id="iHow">홈 화면에 추가하면 앱처럼 쓸 수 있어요</span></div><button id="iBtn" type="button">설치</button><button id="iX" type="button" aria-label="닫기">✕</button></div>
<div id="inapp"><img src="icons/icon-192.png" alt=""><b>브라우저에서 열어 주세요</b>
  <p id="inMsg">카카오톡 안에서는 앱 설치가 안 돼요.<br>아래 버튼을 누르면 브라우저로 열려요.</p>
  <button class="big" id="inGo" type="button">브라우저로 열기</button>
  <small id="inHow"></small>
  <button class="sub" id="inStay" type="button">설치 없이 여기서 그냥 쓰기</button></div>
<div id="guide"><img src="icons/icon-192.png" alt=""><b>홈 화면에 씨앤씨 추가</b>
  <div class="steps" id="gSteps"></div>
  <button class="big" id="gBtn" type="button" style="display:none">지금 설치하기</button>
  <button class="sub" id="gX" type="button">나중에 할게요</button>
  <div class="arrow" id="gArrow" style="display:none">⬇️</div></div>
<div id="pushc"><div class="r"><img src="icons/icon-192.png" alt=""><div><b>휴대폰 알림을 켤까요?</b><br><small id="pcMsg">수리 출고가 끝나면 바로 알려 드려요</small></div></div>
  <div class="b"><button id="pcNo" type="button">나중에</button><button id="pcOn" type="button">🔔 알림 켜기</button></div></div>
<div id="ptoast"></div>
<div id="offline"><b style="font-size:20px">인터넷 연결이 없어요</b><span style="color:var(--mut)">연결된 뒤 다시 시도해 주세요</span><button type="button" onclick="location.reload()">다시 시도</button></div>
<script>
  // ▼ Apps Script 웹 앱 주소 (배포 URL이 바뀌면 여기만 고치면 됨)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbw6Qsi7ZVZktH4xutPdGWHkYaM1u2nw6HGJDN3u8mBQVk0sbqBTpPliLXGwn20O_ix8/exec';

  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  var UA = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1), android = /android/i.test(UA);
  var ourApp = /CncSalesApp/.test(UA) || /[?&]app=android/.test(location.search);   // 안드로이드 앱(설치 파일)으로 연 경우
  var kakao = /KAKAOTALK/i.test(UA);
  var inApp = !ourApp && (kakao || /NAVER\(inapp|Line\/|Instagram|FBAN|FBAV|DaumApps|everytimeApp|BAND\/|; wv\)/i.test(UA));
  var standalone = ourApp || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var APK_URL = 'https://github.com/leekyounghyen-cmyk/cnc-sales-app/releases/download/android/cnc-sales.apk';
  var fromLink = new URLSearchParams(location.search).has('install');   // 카톡 등에서 넘어온 경우 → 설치 안내를 크게

  function start() {
    if (frame.src) return;
    if (!navigator.onLine) { document.getElementById('offline').classList.add('on'); return; }
    frame.src = APP_URL + '?shell=' + (ourApp ? 'apk' : 'web');
    frame.addEventListener('load', function () { setTimeout(function () { splash.classList.add('off'); }, 300); });
    setTimeout(function () { splash.classList.add('off'); }, 12000);
  }
  window.addEventListener('online', function () { if (!frame.src) location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  // ① 카카오톡·네이버·인스타 등 앱 안 브라우저: 설치가 안 되므로 바깥 브라우저로 넘김
  function target() { var u = new URL(location.href); u.searchParams.set('install', '1'); return u.toString(); }
  function openOutside() {
    if (kakao) {
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target());
      setTimeout(function () { location.href = ios ? 'kakaoweb://closeBrowser' : 'kakaotalk://inappbrowser/close'; }, 1500);
    } else if (android) {
      var u = new URL(target());
      location.href = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=https;package=com.android.chrome;end';
    }
  }
  // ?apk=1 링크: 카톡 등에서는 크롬으로 넘긴 뒤, 크롬에서 앱 파일(APK) 바로 받기
  var wantApk = /[?&]apk=1/.test(location.search);
  if (wantApk && !inApp && !ourApp) {
    if (android) {
      location.href = APK_URL;
      splash.querySelector('span').innerHTML = '앱 파일을 받는 중…<br><br>위나 아래에 뜨는 <b>다운로드</b> 알림을 눌러 설치하세요.<br><small>안 받아지면 <a href="' + APK_URL + '">여기</a>를 누르세요</small>';
    } else {
      splash.querySelector('span').innerHTML = '앱 파일은 안드로이드 전용이에요.<br>아이폰은 <a href="./?install=1">홈 화면에 추가</a>로 설치하세요.';
    }
    splash.querySelector('span').style.cssText = 'text-align:center;line-height:1.6;padding:0 24px';
    splash.querySelector('.bar').style.display = 'none';
    throw 0;   // 아래 앱 불러오기는 생략
  }
  if (inApp && !standalone) {
    var ia = document.getElementById('inapp');
    if (ios && !kakao) {   // 아이폰의 다른 앱 안: 자동으로 못 넘김 → 방법 안내
      document.getElementById('inMsg').innerHTML = '이 앱 안에서는 설치가 안 돼요.<br>메뉴 <b>···</b> → <b>Safari로 열기</b>를 눌러 주세요.';
      document.getElementById('inGo').style.display = 'none';
    } else {
      if (wantApk) document.getElementById('inMsg').innerHTML = '카카오톡 안에서는 앱 파일을 받을 수 없어요.<br>아래 버튼을 누르면 크롬에서 바로 받아져요.';
      document.getElementById('inHow').textContent = kakao ? '안 넘어가면: 오른쪽 아래 ··· (또는 ⋮) → 「다른 브라우저로 열기」' : '안 넘어가면: 메뉴(⋮) → 「다른 브라우저로 열기」';
      openOutside();
    }
    document.getElementById('inGo').addEventListener('click', openOutside);
    document.getElementById('inStay').addEventListener('click', function () { ia.classList.remove('on'); start(); });
    ia.classList.add('on'); splash.classList.add('off');
  } else {
    start();
  }

  // ② 설치 안내: 평소엔 아래 작은 막대, 카톡에서 넘어온 경우엔 전체 화면 안내
  var dismissed = false; try { dismissed = localStorage.getItem('installDismissed') === '1'; } catch (e) {}
  var bar = document.getElementById('install'), how = document.getElementById('iHow'), btn = document.getElementById('iBtn'), deferred = null;
  var guide = document.getElementById('guide'), gSteps = document.getElementById('gSteps'), gBtn = document.getElementById('gBtn');
  function showGuide() {
    if (ios) {
      gSteps.innerHTML = /CriOS/.test(UA)
        ? '<div>1. 주소창 오른쪽 <b>공유(□↑)</b> 버튼</div><div>2. <b>홈 화면에 추가</b></div><div>3. 오른쪽 위 <b>추가</b></div>'
        : '<div>1. 아래 <b>공유(□↑)</b> 버튼<br><small>안 보이면 아래 <b>···</b> → 공유</small></div><div>2. 목록을 올려 <b>홈 화면에 추가</b></div><div>3. 오른쪽 위 <b>추가</b></div>';
      document.getElementById('gArrow').style.display = /CriOS/.test(UA) ? 'none' : 'block';
    } else if (deferred) {
      gSteps.innerHTML = '<div>아래 버튼을 누르고 <b>설치</b>를 누르면 끝!</div>';
      gBtn.style.display = 'block';
    } else {
      gSteps.innerHTML = '<div>1. 오른쪽 위 메뉴 <b>⋮</b></div><div>2. <b>앱 설치</b> 또는 <b>홈 화면에 추가</b></div><div>3. <b>설치</b> 누르기</div>';
    }
    if (android) gSteps.innerHTML += '<div style="border-top:1px solid rgb(127 127 127/.2);margin-top:6px;padding-top:10px"><small>정식 앱으로 쓰고 싶다면 <a href="' + APK_URL + '">안드로이드 앱 파일 받기</a><br>받은 파일을 눌러 설치 (처음 한 번 「출처를 알 수 없는 앱 허용」)</small></div>';
    bar.classList.remove('on'); guide.classList.add('on');
  }
  function doInstall() {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { bar.classList.remove('on'); guide.classList.remove('on'); deferred = null; });
  }
  if (!standalone && !inApp) {
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); deferred = e;
      if (guide.classList.contains('on')) showGuide(); else if (!dismissed) bar.classList.add('on');
    });
    if (fromLink) setTimeout(showGuide, ios ? 600 : 1500);
    else if (!dismissed) {
      if (ios) { how.textContent = '사파리 아래 공유 버튼(□↑) → 「홈 화면에 추가」'; btn.style.display = 'none'; setTimeout(function () { bar.classList.add('on'); }, 1500); }
      else setTimeout(function () { if (!deferred) { how.textContent = '브라우저 메뉴(⋮) → 「홈 화면에 추가」 또는 「앱 설치」'; btn.style.display = 'none'; bar.classList.add('on'); } }, 4000);
    }
  }
  btn.addEventListener('click', doInstall);
  gBtn.addEventListener('click', doInstall);
  document.getElementById('gX').addEventListener('click', function () { guide.classList.remove('on'); });
  document.getElementById('iX').addEventListener('click', function () {
    bar.classList.remove('on'); try { localStorage.setItem('installDismissed', '1'); } catch (e) {}
  });
  window.addEventListener('appinstalled', function () { bar.classList.remove('on'); guide.classList.remove('on'); });

  // ③ 휴대폰 알림(푸시) — 앱 화면(Apps Script)이 로그인 정보를 보내 주면 여기서 알림을 켬
  var VAPID_PUB = 'BNg0ug4KUwXkYnCq-qlsYZTjf1LMtqbZpkpRAWvODwM_0nyjmywrL1KHu9_IZLMWWAYKhnlT9QMyL491gDsHKBQ';
  var idb = (function () {
    function open() { return new Promise(function (ok, no) { var r = indexedDB.open('cnc', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { ok(r.result); }; r.onerror = no; }); }
    return {
      set: function (k, v) { return open().then(function (db) { return new Promise(function (ok) { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); }).catch(function () {}); },
      get: function (k) { return open().then(function (db) { return new Promise(function (ok) { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ok(null); }; }); }).catch(function () { return null; }); }
    };
  })();
  var TOKEN = '', pc = document.getElementById('pushc'), pcMsg = document.getElementById('pcMsg');
  function ptoast(t) { var el = document.getElementById('ptoast'); el.textContent = t; el.classList.add('on'); clearTimeout(ptoast.t); ptoast.t = setTimeout(function () { el.classList.remove('on'); }, 3500); }
  function pushOk() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function b64u(s) { var p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function api(body) { return fetch(APP_URL, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function subscribe(quiet) {
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) }); });
    }).then(function (sub) {
      return api({ api: 'push', token: TOKEN, sub: sub.toJSON(), ua: (ios ? 'iPhone' : android ? 'Android' : 'PC') });
    }).then(function (r) {
      if (r && r.ok) { try { localStorage.setItem('pushAt', String(Date.now())); } catch (e) {} if (!quiet) ptoast('알림이 켜졌어요 ✓ 출고되면 바로 알려 드릴게요'); }
      else if (!quiet) ptoast('알림 등록에 실패했어요. 다시 시도해 주세요');
    }).catch(function (e) { if (!quiet) ptoast('알림을 켜지 못했어요 (' + (e && e.message || e) + ')'); });
  }
  function showPushCard(force) {
    if (ourApp) { try { window.CncApp && CncApp.askPermission(); } catch (e) {} return; }
    if (!pushOk()) {
      if (force) ptoast(ios && !standalone ? '아이폰은 홈 화면에 추가한 「씨앤씨」 앱에서만 알림을 받을 수 있어요' : '이 브라우저는 알림을 지원하지 않아요');
      return;
    }
    if (Notification.permission === 'denied') { if (force) ptoast('알림이 차단돼 있어요. 휴대폰 설정 → 알림에서 「씨앤씨」를 켜 주세요'); return; }
    if (Notification.permission === 'granted') { subscribe(!force); return; }
    var no = false; try { no = Number(localStorage.getItem('pushNo') || 0) > Date.now() - 3 * 86400000; } catch (e) {}
    if (!force && (no || (ios && !standalone))) return;
    pc.classList.add('on');
  }
  document.getElementById('pcOn').addEventListener('click', function () {
    pc.classList.remove('on');
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') subscribe(false); else ptoast('알림을 허용하지 않았어요. 나중에 메뉴(⋯) → 「휴대폰 알림 켜기」로 켤 수 있어요');
    });
  });
  document.getElementById('pcNo').addEventListener('click', function () { pc.classList.remove('on'); try { localStorage.setItem('pushNo', String(Date.now())); } catch (e) {} });
  window.addEventListener('message', function (e) {
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) {}
    if (!/(^|[.])googleusercontent[.]com$/.test(host)) return;   // 우리 앱 화면에서 온 것만
    var m = e.data; if (!m || !m.cnc) return;
    if (m.t === 'token' && /^[a-f0-9]{64}$/.test(m.token || '')) {
      var changed = m.token !== TOKEN; TOKEN = m.token; idb.set('token', TOKEN);
      if (ourApp) { try { window.CncApp && CncApp.setToken(TOKEN); } catch (x) {} return; }
      var last = 0; try { last = Number(localStorage.getItem('pushAt') || 0); } catch (x) {}
      if (changed) setTimeout(function () { if (pushOk() && Notification.permission === 'granted') { if (Date.now() - last > 86400000) subscribe(true); } else showPushCard(false); }, 2500);
    } else if (m.t === 'logout') {
      var old = TOKEN; TOKEN = ''; idb.set('token', ''); idb.set('since', 0);
      if (ourApp) { try { window.CncApp && CncApp.setToken(''); } catch (x) {} return; }
      if (pushOk()) navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (s) {
        if (!s) return; if (old) api({ api: 'unpush', token: old, endpoint: s.endpoint }).catch(function () {}); return s.unsubscribe();
      }).catch(function () {});
      try { localStorage.removeItem('pushAt'); } catch (x) {}
    } else if (m.t === 'push') { showPushCard(true);
    } else if (m.t === 'check') { if (ourApp) { try { window.CncApp && CncApp.checkNow(); } catch (x) {} } }
  });
</script>
