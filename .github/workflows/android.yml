name: 안드로이드 앱 만들기

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            # 저장된 키가 없으면 이번 빌드용 키를 새로 만듦 (이 경우 다음 버전은 지우고 다시 설치해야 함)
            P=$(openssl rand -hex 16); echo "::add-mask::$P"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias cnc -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=CNC Co Ltd, O=CNC, C=KR"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi

      - name: APK 만들기
        working-directory: android
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: 다운로드 링크에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cnc-sales.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android cnc-sales.apk \
            --title "씨앤씨 안드로이드 앱 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 cnc-sales.apk 를 눌러 받은 뒤 설치하세요. 처음 한 번은 '출처를 알 수 없는 앱 설치 허용'이 필요해요." \
            --latest
